name: CI

# The whole file. Every service in the estate calls the ONE reusable workflow in micro-org rather
# than carrying its own copy — the measured target in docs/ecosystem/03 §5 is zero bespoke CI files.
# If this repository ever needs a job of its own, that is the signal the reusable workflow needs an
# input, not that this repository needs a fork of it.
#
# `service-ci.yml` typechecks, runs the suite against a real Postgres `ci_test` container, and FAILS
# the build if the database-backed suite skipped — which is why `src/testsupport.ts` reads
# `COMMUNITY_TEST_DATABASE_URL` spelled exactly as the workflow derives it from `database-env-var`.
# It also enforces the estate rules (one database, no cross-service imports, the three health
# endpoints, no unleased timers) that repository walls used to enforce for free.
#
# A SKIPPED SUITE HERE WOULD BE WORSE THAN IN ALMOST ANY OTHER REPOSITORY. Every property this
# service exists to hold is a DATABASE property, and not one of them exists in a fake:
#
#   * one member, one counted vote — a unique constraint, proven under concurrency
#   * a delegation cycle refused — a trigger holding an advisory lock, proven with two connections
#   * a timelock a handler cannot bypass — a BEFORE INSERT trigger, proven with a raw INSERT
#   * one execution per proposal — a unique constraint plus a row lock, proven with two workers
#
# A green build with this suite skipped would be proving the tally arithmetic and nothing that
# stands between a vote and somebody else's money.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: cloudsforge-online/micro-org/.github/workflows/service-ci.yml@main
    with:
      service: community
      database-env-var: COMMUNITY_DATABASE_URL
      # 4000 inside the container, as every service but foresight binds. Read from this repository's
      # own Dockerfile EXPOSE and src/env.ts default rather than chosen here — a port is a fact
      # about a service, not an allocation, and picking a free-looking number is how `emberkin` was
      # registered on 3014 while it binds 4100.
      port: 4000
      # The image startup smoke test boots the real service, and `env.ts` validates its configuration
      # at import — so the container needs the variables it declares, not just a database, or it
      # exits before it serves /livez. The URLs are CI-only NON-secrets, never dialled because /livez
      # needs no upstream, and never a real credential.
      #
      # THE TWO OUTBOX-FAMILY VARIABLES ARE NOT THROWAWAY ANY MORE, and the value they used to carry
      # is why. `ci-only-not-a-real-secret-…` "only had to clear a length and placeholder check" —
      # which is word for word the property that let `estate-only-outbox-secret-…` sit on 54 lines of
      # a PUBLIC compose file and pass every guard in the estate (micro-org #142). The boot guard now
      # checks the SHAPE and has no CI exemption, so `@generate` asks service-ci.yml for a fresh
      # `openssl rand -base64 48`: CI holds a real secret rather than a string claiming to be one.
      # Each line gets its OWN value, which is what keeps proving the ingest list and the signing
      # scalar are separate variables rather than one read twice.
      #
      # COMMUNITY_SERVICE_CREDENTIAL is deliberately NOT `@generate`: it is not part of the outbox
      # key family, it is validated by the weaker `requiredSecret`, and it stays a throwaway.
      #
      # Note what is NOT here, and cannot be: there is no variable that shortens or bypasses a
      # timelock, so there is nothing CI could set to make the smoke test's life easier at the cost
      # of the guarantee. `env.test.ts` asserts that absence by pattern.
      #
      # INDEXER_BASE_URL is deliberately absent too. Its absence is a supported mode — the holdings
      # oracle answers "unknown", and an unknown holding never demotes anybody.
      smoke-env: |
        IDENTITY_JWKS_URL=http://127.0.0.1:4001/.well-known/jwks.json
        IDENTITY_ISSUER=http://127.0.0.1:4001
        LEDGER_BASE_URL=http://127.0.0.1:4002
        POLICY_BASE_URL=http://127.0.0.1:4003
        COMMUNITY_INGEST_SECRETS=@generate
        OUTBOX_SIGNING_SECRET=@generate
        COMMUNITY_SERVICE_CREDENTIAL=ci-only-not-a-real-secret-22222222
    secrets:
      # @cloudsforge/* is resolved by link:../runtime and link:../contracts, so CI checks out
      # micro-runtime and micro-contracts as siblings — both private, so the workflow needs a
      # contents:read token. This service takes BOTH: src/ledgerclient.ts imports
      # @cloudsforge/contracts-money for AccountSubject, Actor and LedgerAssetCode.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: read

  hygiene:
    uses: cloudsforge-online/micro-org/.github/workflows/secret-hygiene.yml@main
    permissions:
      contents: read

  # ──────────────────────────────────────────────────────────────────────────────────────────────
  # THE IMAGE, PUBLISHED. `cfctl release` writes a manifest naming ghcr.io/cloudsforge-online/<repo>
  # at this repository's package.json version (micro-org tools/cfctl.ts:889-934, image name derived
  # at tools/registry.ts:367-369); `cfctl release --verify` runs `docker manifest inspect` on every
  # entry (cfctl.ts:937-975); and deploy/scripts/release-deploy.sh:99-125 refuses to change anything
  # until all of them pull. Until this job existed CI built this image and threw it away, so that
  # gate rejected every service in the estate and the manifest path could not be used at all.
  #
  # `packages: write` IS GRANTED HERE rather than asked for inside the shared CI workflow, and that
  # is forced rather than stylistic: a called workflow's GITHUB_TOKEN can only be maintained or
  # reduced, never elevated, so a reusable workflow asking for a permission its caller withheld
  # fails the whole run at STARTUP — before a step runs, on pull requests as well as on main.
  # Measured on micro-org: run 30900277471 (caller capped at `packages: read`) ended in
  # startup_failure; run 30900280323 (same workflow, caller granted `packages: write`) succeeded.
  # That is also why `push: false` is correct and stays in the shared workflow's image job — that
  # job is a GATE and needs `load:` so it can boot the image and read its health endpoint. This is
  # the producer. Different purposes, so different jobs.
  # ──────────────────────────────────────────────────────────────────────────────────────────────
  publish:
    needs: [ci, hygiene]
    # A green push to main and nothing else. An image tag a release manifest pins has to name
    # something that passed, on the branch it will be deployed from.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: cloudsforge-online/micro-org/.github/workflows/publish-image.yml@main
    with:
      kind: service
    secrets:
      # The same sibling checkouts the Dockerfile's named build contexts need: the image cannot be
      # built without micro-runtime and micro-contracts beside it.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: write
